<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple HTML Page with Live Chat Integration</title>
  <style>
    #chat-widget-container {
      font-family: 'Helvetica', 'Arial', Courier, monospace;
      position: fixed;
      bottom: 80px;
      right: 20px;
      background-color: #fff;
      border: 1px solid #ccc;
      border-radius: 10px;
      box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);
      width: 300px;
      height: 500px;
      display: none;
    }

    /* Button styling */
    #chat-widget-button {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #007bff;
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      line-height: 50px;
      text-align: center;
      font-size: 12px;
      cursor: pointer;
      font-family: 'Helvetica', 'Arial', Courier, monospace;
      font-weight: 100;
    }
  </style>
</head>
<body>

  <h1>Simple HTML Page with Live Chat Integration</h1>

  <!-- Chat Widget Button -->
  <div id="chat-widget-button">Bot</div>

  <!-- Chat Widget Container -->
  <div id="chat-widget-container"></div>

  <script>
    // 1. Generate or retrieve a unique external_id for each visitor
    let externalId = localStorage.getItem('chat_external_id');
    if (!externalId) {
      externalId = 'user_' + Math.random().toString(36).substr(2, 8);
      localStorage.setItem('chat_external_id', externalId);
    }
  
    // 2. Initialize the live chat widget with persistent external_id
    new LiveChatWidget({
      host:         "https://a.messageflow.ai",
      uid:          "e1fe2d3dcaa36e7e23a31e90156d32f1bd07b3a7",
      css_url:      "https://a.messageflow.ai/live_chat/chat.css",
      show_question:false,
      button_title: "Chat",
      external_id:  externalId, // <- persists across reloads
      chat_title:   "Support Chat"
    });
  </script>

</body>
</html>
