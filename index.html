<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple HTML Page with Live Chat Integration</title>
  <style>
    #chat-widget-container {
      font-family: 'Helvetica', 'Arial', Courier, monospace;
      position: fixed;
      bottom: 80px;
      right: 20px;
      background-color: #fff;
      border: 1px solid #ccc;
      border-radius: 10px;
      box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);
      width: 300px;
      height: 500px;
      display: none;
    }

    /* Button styling */
    #chat-widget-button {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #007bff;
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      line-height: 50px;
      text-align: center;
      font-size: 12px;
      cursor: pointer;
      font-family: 'Helvetica', 'Arial', Courier, monospace;
      font-weight: 100;
    }
  </style>
</head>
<body>

  <h1>Simple HTML Page with Live Chat Integration</h1>

  <!-- Chat Widget Button -->
  <div id="chat-widget-button">Bot</div>

  <!-- Chat Widget Container -->
  <div id="chat-widget-container"></div>

  <!-- 1) Load the widget library -->
  <script src="https://a.messageflow.ai/live_chat/chat.js"></script>

  <script>
    // 2) Persistent external_id
    let externalId = localStorage.getItem('chat_external_id');
    if (!externalId) {
      externalId = 'user_' + Math.random().toString(36).substr(2, 8);
      localStorage.setItem('chat_external_id', externalId);
    }

    // 3) Instantiate into your container
    const chat = new LiveChatWidget({
      host:         "https://a.messageflow.ai",
      uid:          "e1fe2d3dcaa36e7e23a31e90156d32f1bd07b3a7",
      css_url:      "https://a.messageflow.ai/live_chat/chat.css",
      show_question:false,
      button_title: "Chat",
      external_id:  externalId,
      chat_title:   "Support Chat",
      container:    '#chat-widget-container'
    });

    // 4) Toggle on button click
    const btn = document.getElementById('chat-widget-button');
    const container = document.getElementById('chat-widget-container');
    btn.addEventListener('click', () => {
      container.style.display = container.style.display === 'none' ? 'block' : 'none';
    });
  </script>

</body>
</html>
